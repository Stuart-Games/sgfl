[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project.scripts]
sgfl = "sgfl.cli:app"

[project]
dependencies = ["typer", "requests", "python-dotenv", "zstandard"]
name = "sgfl"
version = "2.9.1"
authors = [{ name = "devvf" }]
maintainers = [{ name = "stuart-2202" }]
description = "A package for managing the Stuart Games Roblox workflow."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
